<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tehlike Tespit Sistemi</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #0d1117;
      --surface: #161b22;
      --border:  #30363d;
      --muted:   #8b949e;
      --text:    #e6edf3;
      --blue:    #58a6ff;
      --radius:  10px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px 12px 32px;
      gap: 14px;
    }

    h1 {
      font-size: clamp(0.85rem, 3vw, 1.1rem);
      font-weight: 600;
      letter-spacing: 0.1em;
      color: var(--muted);
      text-transform: uppercase;
    }

    #video-wrap {
      position: relative;
      width: 100%;
      max-width: 860px;
      border-radius: var(--radius);
      overflow: hidden;
      background: var(--surface);
      border: 1px solid var(--border);
      aspect-ratio: 4 / 3;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #camera-feed {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: none;
    }

    #placeholder {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      color: #3d444d;
      user-select: none;
    }
    #placeholder svg { width: 56px; height: 56px; }
    #placeholder p   { font-size: 0.9rem; }

    #loading-overlay {
      display: none;
      position: absolute;
      inset: 0;
      background: rgba(13, 17, 23, .78);
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 14px;
      color: var(--muted);
      font-size: 0.88rem;
    }
    #loading-overlay.active { display: flex; }

    .spinner {
      width: 38px; height: 38px;
      border: 3px solid var(--border);
      border-top-color: var(--blue);
      border-radius: 50%;
      animation: spin .85s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    #btn-toggle {
      padding: 13px 0;
      width: 100%;
      max-width: 860px;
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: .05em;
      border: none;
      border-radius: var(--radius);
      cursor: pointer;
      background: #238636;
      color: #fff;
      transition: background .2s, transform .1s;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    #btn-toggle:hover  { background: #2ea043; }
    #btn-toggle:active { transform: scale(0.98); }
    #btn-toggle.running       { background: #b62324; }
    #btn-toggle.running:hover { background: #da3633; }
    #btn-toggle:disabled { opacity: .45; cursor: not-allowed; }
  </style>
</head>
<body>

  <h1>Tehlike Tespit Sistemi</h1>

  <div id="video-wrap">
    <div id="placeholder">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M23 7L16 12 23 17V7z"/>
        <rect x="1" y="5" width="15" height="14" rx="2" ry="2"/>
      </svg>
      <p>Sistemi başlatmak için butona basın</p>
    </div>
    <img id="camera-feed" src="" alt="Kamera akışı" />
    <div id="loading-overlay">
      <div class="spinner"></div>
      <span>Modeller yükleniyor…</span>
    </div>
  </div>

  <button id="btn-toggle" onclick="toggleSystem()">Başlat</button>

  <script>
    let isRunning   = false;
    let alertSource = null;
    let statusTimer = null;

    const feed        = document.getElementById('camera-feed');
    const placeholder = document.getElementById('placeholder');
    const loadOverlay = document.getElementById('loading-overlay');
    const btn         = document.getElementById('btn-toggle');

    function toggleSystem() {
      if (!isRunning) startSystem(); else stopSystem();
    }

    function startSystem() {
      btn.disabled = true;
      fetch('/start')
        .then(r => r.json())
        .then(data => {
          if (!data.ok) { btn.disabled = false; return; }
          isRunning = true;
          btn.textContent = 'Durdur';
          btn.classList.add('running');
          btn.disabled = false;
          placeholder.style.display = 'none';
          loadOverlay.classList.add('active');
          connectAlerts();
          pollUntilRunning();
        })
        .catch(() => { btn.disabled = false; });
    }

    function stopSystem() {
      btn.disabled = true;
      fetch('/stop')
        .then(r => r.json())
        .then(() => {
          isRunning = false;
          btn.textContent = 'Başlat';
          btn.classList.remove('running');
          btn.disabled = false;
          feed.src = '';
          feed.style.display = 'none';
          placeholder.style.display = 'flex';
          loadOverlay.classList.remove('active');
          clearInterval(statusTimer); statusTimer = null;
          if (alertSource) { alertSource.close(); alertSource = null; }
        })
        .catch(() => { btn.disabled = false; });
    }

    function pollUntilRunning() {
      statusTimer = setInterval(() => {
        fetch('/status')
          .then(r => r.json())
          .then(data => {
            if (data.state === 'running') {
              clearInterval(statusTimer); statusTimer = null;
              loadOverlay.classList.remove('active');
              feed.src = '/video_feed';
              feed.style.display = 'block';
            } else if (data.state === 'idle') {
              clearInterval(statusTimer); statusTimer = null;
              loadOverlay.classList.remove('active');
              placeholder.style.display = 'flex';
              isRunning = false;
              btn.textContent = 'Başlat';
              btn.classList.remove('running');
            }
          })
          .catch(() => {});
      }, 800);
    }

    function connectAlerts() {
      if (alertSource) alertSource.close();
      alertSource = new EventSource('/alerts');
      alertSource.onmessage = (e) => {
        const msg = e.data.trim();
        if (!msg) return;
        speakTurkish(msg);
      };
    }

    function speakTurkish(text) {
      if (!('speechSynthesis' in window)) return;
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'tr-TR';
      u.rate = 1.2;
      window.speechSynthesis.cancel();
      window.speechSynthesis.speak(u);
    }
  </script>

</body>
</html>
